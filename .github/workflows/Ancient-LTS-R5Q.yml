name: Ancient-LTS R5Q (SM8150)

on:
  push:
    branches: [ lineage-17.1, main, master ]
  pull_request:
  workflow_dispatch:

env:
  KERNEL_NAME: Ancient-LTS
  KBUILD_BUILD_USER: bjakp12
  KBUILD_BUILD_HOST: ubunt
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: r5q_eur_open_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libc6-dev-i386 libelf-dev libncurses5-dev libssl-dev \
            python3 rsync unzip wget xz-utils zip zlib1g-dev kmod

      - name: Setup Proton Clang (latest)
        run: |
          mkdir -p $GITHUB_WORKSPACE/proton
          cd $GITHUB_WORKSPACE/proton
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton.tar.gz
          tar -xzf proton.tar.gz --strip-components=1
          echo "PROTON=$GITHUB_WORKSPACE/proton" >> $GITHUB_ENV
          "$GITHUB_WORKSPACE/proton/bin/clang" --version

      - name: Setup GCC 64 + 32 (for --gcc-toolchain fallback)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi || true
          echo "GCC64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "GCC32_PREFIX=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Apply Ancient-LTS UV patch (optional, fails safe)
        run: |
          if [ -f ancientlts-r5q/01-ancientlts-sm8150-uv80.patch ]; then
            git apply --check ancientlts-r5q/01-ancientlts-sm8150-uv80.patch && \
            git apply ancientlts-r5q/01-ancientlts-sm8150-uv80.patch && \
            echo "UV patch applied" || echo "UV patch skipped (already applied or mismatch)"
          else
            echo "UV patch file not in repo, skipping (expected if workflow copied manually)"
          fi
          grep -n "ANCIENT_LTS_UV_OFFSET_MV" drivers/clk/qcom/clk-cpu-osm.c || true

      - name: Merge Ancient-LTS defconfig fragment
        run: |
          cp arch/arm64/configs/${{ env.DEFCONFIG }} .config
          if [ -f ancientlts-r5q/ancientlts-r5q.fragment ]; then
            ./scripts/kconfig/merge_config.sh -m .config ancientlts-r5q/ancientlts-r5q.fragment
          fi
          make ARCH=arm64 olddefconfig
          grep -E "CONFIG_LOCALVERSION=|CONFIG_DEFAULT_HOSTNAME|CONFIG_HZ=|CONFIG_CPU_FREQ_DEFAULT_GOV|CONFIG_DEFAULT_TCP_CONG" .config || true
          cp .config arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: Build with Proton Clang + latency opts (battery-safe)
        run: |
          export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          # Optimasi: O2 (via defconfig) + mcpu A76/A55, LTO ringan dimatikan agar hemat baterai & stabil di 4.14.
          # Polly + ThinLTO sengaja TIDAK dipakai penuh di 4.14 Samsung agar tidak boros / bootloop.
          export KCFLAGS="-O2 -mcpu=cortex-a76.cortex-a55 -mtune=cortex-a76.cortex-a55 -fno-pic -fno-pie"
          export KAFLAGS="-mcpu=cortex-a76.cortex-a55"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/proton/lib:$LD_LIBRARY_PATH"
          nproc
          make -j$(nproc) ARCH=arm64 \
            CC="clang" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            Image.gz-dtb 2>&1 | tee build.log
          ls -lh arch/arm64/boot/Image* arch/arm64/boot/dts/qcom/*.dtb 2>/dev/null || true
          echo "=== version ==="
          strings arch/arm64/boot/Image.gz-dtb 2>/dev/null | grep -m2 "Linux version" || true
          echo "=== compile by/host ==="
          strings arch/arm64/boot/Image.gz-dtb 2>/dev/null | grep -m2 "bjakp12.*ubunt" || true

      - name: Package AnyKernel3 (optional)
        if: success()
        run: |
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then echo "Image.gz-dtb missing"; exit 1; fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3 || true
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          # minimal branding
          sed -i 's/kernel.string=.*/kernel.string=Ancient-LTS-R5Q by bjakp12@ubunt/' anykernel.sh || true
          zip -r9 ../Ancient-LTS-R5Q-$(date +%Y%m%d).zip * -x .git/\* || true
          ls -lh ../*.zip || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Ancient-LTS-R5Q
          path: |
            arch/arm64/boot/Image.gz-dtb
            Ancient-LTS-R5Q-*.zip
            build.log
            .config
