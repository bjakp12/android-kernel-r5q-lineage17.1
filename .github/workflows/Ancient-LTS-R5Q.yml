name: Ancient-LTS R5Q (SM8150)

on:
  push:
    branches: [ lineage-17.1, main, master, ancient-lts-r5q ]
  pull_request:
  workflow_dispatch:

env:
  KERNEL_NAME: Ancient-LTS
  KBUILD_BUILD_USER: bjakp12
  KBUILD_BUILD_HOST: ubunt
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: r5q_eur_open_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          # Ancient-LTS: full history so in-tree git version scripts
          # (e.g. qcacld `git log <sha>~..HEAD`) don't fail on shallow clones.
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libc6-dev-i386 libelf-dev libncurses5-dev libssl-dev \
            python3 rsync unzip wget xz-utils zip zlib1g-dev kmod

      - name: Setup Proton Clang (git clone first, tarball fallback)
        id: psetup
        run: |
          rm -rf "$GITHUB_WORKSPACE/proton"
          cd "$GITHUB_WORKSPACE"
          if git clone --depth 1 https://github.com/kdrag0n/proton-clang.git proton; then
            echo "Proton git clone OK"
          else
            echo "Proton git clone FAILED, trying tarball"
            rm -rf proton && mkdir -p proton && cd proton
            if wget -q --tries=3 https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton.tar.gz; then
              tar -xzf proton.tar.gz --strip-components=1 && echo "Proton tarball OK" || echo "Proton tarball extract FAILED"
            else
              echo "Proton tarball download FAILED"
            fi
            cd "$GITHUB_WORKSPACE"
          fi
          echo "PROTON=$GITHUB_WORKSPACE/proton" >> $GITHUB_ENV
          ls "$GITHUB_WORKSPACE/proton/bin" 2>/dev/null | head -n 20 || echo "(no proton/bin)"
          if "$GITHUB_WORKSPACE/proton/bin/clang" --version; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Proton clang binary NOT runnable (setup failed, probe will be skipped)"
          fi

      - name: Install cross binutils (as/ld + --gcc-toolchain for Clang)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi || true
          echo "GCC64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "GCC32_PREFIX=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Apply Ancient-LTS UV patch (optional, fails safe)
        run: |
          if [ -f ancientlts-r5q/01-ancientlts-sm8150-uv80.patch ]; then
            git apply --check ancientlts-r5q/01-ancientlts-sm8150-uv80.patch && \
            git apply ancientlts-r5q/01-ancientlts-sm8150-uv80.patch && \
            echo "UV patch applied" || echo "UV patch skipped (already applied or mismatch)"
          else
            echo "UV patch file not in repo, skipping (expected if workflow copied manually)"
          fi
          grep -n "ANCIENT_LTS_UV_OFFSET_MV" drivers/clk/qcom/clk-cpu-osm.c || true

      - name: Merge Ancient-LTS defconfig fragment
        run: |
          cp arch/arm64/configs/${{ env.DEFCONFIG }} .config
          if [ -f ancientlts-r5q/ancientlts-r5q.fragment ]; then
            ./scripts/kconfig/merge_config.sh -m .config ancientlts-r5q/ancientlts-r5q.fragment
          fi
          make ARCH=arm64 olddefconfig
          grep -E "CONFIG_LOCALVERSION=|CONFIG_DEFAULT_HOSTNAME|CONFIG_HZ=|CONFIG_CPU_FREQ_DEFAULT_GOV|CONFIG_DEFAULT_TCP_CONG" .config || true
          cp .config arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: Probe Proton Clang (3 attempts, logs saved)
        id: probe
        run: |
          if [ "${{ steps.psetup.outputs.ok }}" != "true" ]; then
            echo "proton_ok=false" >> "$GITHUB_OUTPUT"
            echo "Proton setup failed, skipping probe (AOSP Clang next)"
            exit 0
          fi
          export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/proton/lib:$LD_LIBRARY_PATH"
          clang --version
          which aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc aarch64-linux-gnu-as || true
          echo 'int probe_stackprotector(void){return 0;}' > "$GITHUB_WORKSPACE/probe-test.c"
          try_clang() {
            _log="$1"; shift
            if clang --target=aarch64-linux-gnu "$@" -O2 -fstack-protector-strong \
                "$GITHUB_WORKSPACE/probe-test.c" -c -o /dev/null >"$_log" 2>&1; then
              echo "PASS ($*)"
              return 0
            else
              echo "FAIL ($*), log $_log:"
              cat "$_log" || true
              return 1
            fi
          }
          PROBE_OK=false
          if try_clang "$GITHUB_WORKSPACE/probe-proton-1.log" --gcc-toolchain=/usr -fno-integrated-as; then PROBE_OK=true; fi
          if [ "$PROBE_OK" != "true" ]; then
            if try_clang "$GITHUB_WORKSPACE/probe-proton-2.log" --prefix=/usr/bin/ --gcc-toolchain=/usr -fno-integrated-as; then PROBE_OK=true; fi
          fi
          if [ "$PROBE_OK" != "true" ]; then
            if try_clang "$GITHUB_WORKSPACE/probe-proton-3.log" --gcc-toolchain=/usr; then PROBE_OK=true; fi
          fi
          if [ "$PROBE_OK" = "true" ]; then
            echo "proton_ok=true" >> "$GITHUB_OUTPUT"
            echo "Proton probe: PASS"
          else
            echo "proton_ok=false" >> "$GITHUB_OUTPUT"
            echo "Proton probe: FAIL (all 3 attempts, logs above + in diagnostics.txt)"
          fi

      - name: Setup Lineage Clang r416183b (branch fallbacks + probe)
        id: aosp
        if: steps.probe.outputs.proton_ok != 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -x "$GITHUB_WORKSPACE/aosp-clang/bin/clang" ]; then
            rm -rf "$GITHUB_WORKSPACE/aosp-clang"
            CLONED=false
            if git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git aosp-clang; then
              echo "AOSP clone OK (default branch)"; CLONED=true
            else
              for BR in lineage-19.1 lineage-20.0 lineage-18.1; do
                rm -rf aosp-clang
                echo "Trying AOSP branch $BR ..."
                if git clone --depth 1 -b "$BR" https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git aosp-clang; then
                  echo "AOSP clone OK (branch $BR)"; CLONED=true; break
                fi
              done
            fi
            if [ "$CLONED" != "true" ]; then
              echo "AOSP clone FAILED (all branches)"
            fi
          else
            echo "AOSP clang already present, reusing"
          fi
          ls "$GITHUB_WORKSPACE/aosp-clang/bin" 2>/dev/null | head -n 20 || echo "(no aosp-clang/bin)"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          if ! "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version; then
            echo "aosp_ok=false" >> "$GITHUB_OUTPUT"
            echo "AOSP clang binary broken/missing"
            exit 0
          fi
          ACB="$GITHUB_WORKSPACE/aosp-clang/bin/clang"
          echo 'int probe_stackprotector(void){return 0;}' > "$GITHUB_WORKSPACE/probe-test.c"
          try_aclang() {
            _log="$1"; shift
            if "$ACB" --target=aarch64-linux-gnu "$@" -O2 -fstack-protector-strong \
                "$GITHUB_WORKSPACE/probe-test.c" -c -o /dev/null >"$_log" 2>&1; then
              echo "PASS ($*)"
              return 0
            else
              echo "FAIL ($*), log $_log:"
              cat "$_log" || true
              return 1
            fi
          }
          AOSP_OK=false
          if try_aclang "$GITHUB_WORKSPACE/probe-aosp-1.log" --gcc-toolchain=/usr -fno-integrated-as; then AOSP_OK=true; fi
          if [ "$AOSP_OK" != "true" ]; then
            if try_aclang "$GITHUB_WORKSPACE/probe-aosp-2.log" --prefix=/usr/bin/ --gcc-toolchain=/usr -fno-integrated-as; then AOSP_OK=true; fi
          fi
          if [ "$AOSP_OK" != "true" ]; then
            if try_aclang "$GITHUB_WORKSPACE/probe-aosp-3.log" --gcc-toolchain=/usr; then AOSP_OK=true; fi
          fi
          if [ "$AOSP_OK" = "true" ]; then
            echo "aosp_ok=true" >> "$GITHUB_OUTPUT"
            echo "AOSP probe: PASS"
          else
            echo "aosp_ok=false" >> "$GITHUB_OUTPUT"
            echo "AOSP probe: FAIL (all 3 attempts, logs above + in diagnostics.txt)"
          fi

      - name: Toolchain diagnostics + select (Clang first, GCC last resort)
        id: tc
        run: |
          if [ "${{ steps.probe.outputs.proton_ok }}" = "true" ]; then
            echo "toolchain=proton" >> "$GITHUB_OUTPUT"
            echo "Selected toolchain: Proton Clang"
          elif [ "${{ steps.aosp.outputs.aosp_ok }}" = "true" ]; then
            echo "toolchain=aosp" >> "$GITHUB_OUTPUT"
            echo "Selected toolchain: Lineage/AOSP Clang r416183b"
          else
            echo "toolchain=gcc" >> "$GITHUB_OUTPUT"
            echo "Selected toolchain: GCC fallback (both Clang probes failed; see probe-*.log in diagnostics.txt)"
          fi

      - name: Sanitize Clang dir (unshadow GNU cross tools)
        run: |
          if [ "${{ steps.tc.outputs.toolchain }}" = "gcc" ]; then
            echo "GCC selected, nothing to sanitize."
            exit 0
          fi
          # proton/aosp bin/ dirs ship triple-prefixed wrappers (e.g.
          # aarch64-linux-gnu-elfedit) and sit first in PATH, which poisons
          # the kernel's `which $(CROSS_COMPILE)elfedit` derivation into
          # --prefix=<clang-dir> --gcc-toolchain=<clang-dir> (bogus: not a
          # GCC layout). Clang then falls back to /usr/bin/as (x86_64) and
          # every -Werror cc-option test fails. Move the shadows aside so
          # `which aarch64-linux-gnu-*` resolves to /usr/bin; bare `clang`
          # still resolves to the selected Clang.
          for TCDIR in "$GITHUB_WORKSPACE/proton/bin" "$GITHUB_WORKSPACE/aosp-clang/bin"; do
            [ -d "$TCDIR" ] || continue
            mkdir -p "$TCDIR/.shadowed-by-ancientlts"
            for f in "$TCDIR"/aarch64-linux-gnu-* "$TCDIR"/arm-linux-gnueabi-*; do
              [ -e "$f" ] || continue
              echo "unshadowing: $f"
              mv "$f" "$TCDIR/.shadowed-by-ancientlts/" || true
            done
          done
          echo "--- which check (triple tools must be /usr/bin) ---"
          which -a aarch64-linux-gnu-as aarch64-linux-gnu-elfedit aarch64-linux-gnu-ld arm-linux-gnueabi-as 2>/dev/null || true
          echo "--- clang on PATH (selected Clang must be first) ---"
          export PATH="$GITHUB_WORKSPACE/proton/bin:$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          which -a clang 2>/dev/null || true

      - name: Debug Clang flag compatibility (bisect into clang-debug.log)
        run: |
          if [ "${{ steps.tc.outputs.toolchain }}" = "gcc" ]; then
            echo "GCC selected, skipping clang debug."
            exit 0
          fi
          if [ "${{ steps.tc.outputs.toolchain }}" = "aosp" ]; then
            export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          else
            export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/proton/lib:$LD_LIBRARY_PATH"
          fi
          command -v clang || exit 0
          {
            echo "=== clang flag bisect (reproduces kernel cc-option -Werror test) ===";
            clang --version | head -n2;
            echo "elfedit lookup: [$(which aarch64-linux-gnu-elfedit 2>/dev/null)] (empty => tree --prefix/--gcc-toolchain derivation breaks)";
            echo "shadow check:"; which -a aarch64-linux-gnu-as aarch64-linux-gnu-elfedit arm-linux-gnueabi-as 2>/dev/null || true;
            ELFDIR="$(dirname "$(which aarch64-linux-gnu-elfedit 2>/dev/null)")";
            if [ -e "${ELFDIR}/aarch64-linux-gnu-as" ]; then echo "tree will SKIP --prefix (triple tools resolve via --gcc-toolchain)"; else echo "tree will ADD --prefix=${ELFDIR}"; fi;
            run_test() {
              desc="$1"; shift
              if clang "$@" -Werror -fstack-protector-strong -c -x c /dev/null -o /tmp/bisect.o >/tmp/bisect-err.txt 2>&1; then
                echo "PASS: $desc"
              else
                echo "FAIL: $desc"
                cat /tmp/bisect-err.txt || true
              fi
            }
            T="--target=aarch64-linux-gnu"; P="--prefix=/usr/bin/"; G="--gcc-toolchain=/usr"; NIA="-fno-integrated-as"
            COMMON="-mno-implicit-float -fno-asynchronous-unwind-tables -fno-pic -O2"
            run_test "full set incl -mlittle-endian" $T $P $G $NIA $COMMON -mlittle-endian
            run_test "minus -mlittle-endian" $T $P $G $NIA $COMMON
            run_test "minus --prefix" $T $G $NIA $COMMON -mlittle-endian
            run_test "plus -mabi=lp64" $T $P $G $NIA $COMMON -mlittle-endian -mabi=lp64
            run_test "minus -Werror sanity (expects PASS)" $T $P $G $NIA $COMMON -mlittle-endian -Wno-error
          } | tee clang-debug.log

      - name: Ensure tools/dtc executable (Samsung prebuilt loses +x)
        run: |
          chmod +x tools/dtc || true
          chmod +x scripts/crypto/fips_crypto_integrity.py || true
          ls -l tools/dtc || true
          ./tools/dtc --version 2>&1 | head -n3 || echo "(tools/dtc not runnable, Makefile.lib falls back to scripts/dtc/dtc)"

      - name: Build kernel (Clang first, auto-switch to GCC on error)
        timeout-minutes: 60
        run: |
          set -o pipefail
          chmod +x tools/dtc || true
          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          # -O2: performa; -Wno-error=implicit-*: Clang >=16 menjadikan ini error; code 4.14 butuh diturunkan ke warning.
          # NOTE: JANGAN tambah -fno-pic/-fno-pie di sini. Defconfig pakai
          # CONFIG_RELOCATABLE=y + CONFIG_RANDOMIZE_BASE=y (KASLR); tanpa PIE
          # kernel bisa hang di logo Samsung karena slide KASLR.
          export KCFLAGS="-O2 -Wno-error=implicit-function-declaration -Wno-error=implicit-int -fno-pic -fno-pie"
          # -fcommon: GCC >=10 default -fno-common, dtc era 4.14 (yylloc di
          # lexer+parser) gagal link tanpa ini. Hanya untuk HOST tools.
          export HOSTCFLAGS_ARG='HOSTCFLAGS=-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon'
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          echo "${{ steps.tc.outputs.toolchain }}" > actual-toolchain.txt
          build_gcc() {
            echo "=== Building with GCC (Ubuntu cross-toolchain) ==="
            aarch64-linux-gnu-gcc --version | head -n1
            make -j$(nproc) ARCH=arm64 \
              "$HOSTCFLAGS_ARG" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
              KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
              Image.gz-dtb 2>&1 | tee build.log
          }
          build_clang() {
            if [ "${{ steps.tc.outputs.toolchain }}" = "aosp" ]; then
              echo "=== Building with Lineage/AOSP Clang r416183b ==="
              export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
            else
              echo "=== Building with Proton Clang ==="
              export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
              export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/proton/lib:$LD_LIBRARY_PATH"
            fi
            export CLANG_TRIPLE="aarch64-linux-gnu-"
            make -j$(nproc) ARCH=arm64 \
              "$HOSTCFLAGS_ARG" \
              CC="clang" \
              CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
              KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
              Image.gz-dtb 2>&1 | tee build.log
          }
          if [ "${{ steps.tc.outputs.toolchain }}" = "gcc" ]; then
            build_gcc
          else
            if build_clang; then
              echo "Clang build OK"
            else
              echo "=== Clang build FAILED, auto-switching to GCC fallback ==="
              cp build.log build-clang.log || true
              echo "gcc-fallback" > actual-toolchain.txt
              make ARCH=arm64 clean
              build_gcc
            fi
          fi

      - name: Show build outputs (always)
        if: always()
        run: |
          {
            echo "toolchain=$(cat actual-toolchain.txt 2>/dev/null || echo "${{ steps.tc.outputs.toolchain }}")";
            echo "toolchain_selected=${{ steps.tc.outputs.toolchain }}";
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)";
            ls -lh arch/arm64/boot/ || true;
            echo "--- dtbs ---";
            find arch/arm64/boot -name "*.dtb" || true;
          } | tee diagnostics.txt
          echo "--- tail build.log ---"
          tail -n 80 build.log 2>/dev/null | tee -a diagnostics.txt || echo "no build.log" | tee -a diagnostics.txt
          if [ -f clang-debug.log ]; then
            echo "=== clang-debug.log ===" | tee -a diagnostics.txt
            cat clang-debug.log | tee -a diagnostics.txt
          fi
          {
            echo "=== toolchain forensics ===";
            echo "--- proton clang ---";
            "$GITHUB_WORKSPACE/proton/bin/clang" --version 2>&1 | head -n3 || echo "proton clang NOT runnable";
            echo "--- aosp clang ---";
            "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version 2>&1 | head -n3 || echo "aosp clang NOT runnable";
            echo "--- binutils ---";
            which aarch64-linux-gnu-as aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc 2>&1 || true;
            for f in probe-proton-1.log probe-proton-2.log probe-proton-3.log probe-aosp-1.log probe-aosp-2.log probe-aosp-3.log; do
              echo "--- $f ---";
              cat "$GITHUB_WORKSPACE/$f" 2>/dev/null || echo "(missing)";
            done;
          } | tee -a diagnostics.txt
          echo "=== version ==="
          strings arch/arm64/boot/Image.gz-dtb 2>/dev/null | grep -m2 "Linux version" || true
          echo "=== compile by/host ==="
          strings arch/arm64/boot/Image.gz-dtb 2>/dev/null | grep -m2 "bjakp12.*ubunt" || true

      - name: Package AnyKernel3 (optional)
        if: success()
        run: |
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb missing, build gagal. Lihat build.log di Artifacts."
            ls -lh arch/arm64/boot/
            exit 1
          fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3 || true
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          # Replace upstream Galaxy Nexus template with our r5q script
          # (template ships device.name1=maguro/tuna + omap BLOCK + fstab.tuna
          # patches, which aborts flashing on r5q with a device mismatch).
          if [ -f ../anykernel-r5q.sh ]; then
            cp ../anykernel-r5q.sh anykernel.sh
          fi
          # minimal branding (kept as fallback)
          sed -i 's/kernel.string=.*/kernel.string=Ancient-LTS-R5Q by bjakp12@ubunt/' anykernel.sh || true
          grep -m1 "device.name1" anykernel.sh || true
          zip -r9 ../Ancient-LTS-R5Q-$(date +%Y%m%d).zip * -x .git/\* || true
          ls -lh ../*.zip || true

      - name: Package Magisk boot-patch module
        if: success()
        run: |
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb missing, skip Magisk packaging."
            exit 1
          fi
          if [ ! -f magisk-ancientlts/module.prop ] || [ ! -f magisk-ancientlts/customize.sh ]; then
            echo "magisk-ancientlts/ module source missing in repo, skip Magisk packaging."
            exit 1
          fi
          STAMP=$(date +%Y%m%d)
          rm -rf Magisk-Ancient-LTS && mkdir -p Magisk-Ancient-LTS/tools
          cp magisk-ancientlts/module.prop Magisk-Ancient-LTS/
          cp magisk-ancientlts/customize.sh Magisk-Ancient-LTS/
          cp -r magisk-ancientlts/META-INF Magisk-Ancient-LTS/
          cp arch/arm64/boot/Image.gz-dtb Magisk-Ancient-LTS/Image.gz-dtb
          # Fetch official magiskboot (arm64) from latest Magisk APK; fall back to pinned versions.
          cd Magisk-Ancient-LTS/tools
          APK_URL=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep -m1 '"browser_download_url".*\.apk"' | cut -d'"' -f4 || true)
          for URL in "$APK_URL" \
              "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" \
              "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"; do
            [ -n "$URL" ] && [ "$URL" != "" ] || continue
            echo "Trying $URL"
            if wget -q -O magisk.apk "$URL"; then
              if unzip -o magisk.apk 'lib/arm64-v8a/libmagiskboot.so' -d apkx 2>/dev/null; then
                cp apkx/lib/arm64-v8a/libmagiskboot.so ./magiskboot
                chmod +x ./magiskboot
                ./magiskboot --version 2>/dev/null || ./magiskboot 2>&1 | head -n2 || true
                break
              fi
            fi
          done
          rm -rf apkx magisk.apk
          if [ ! -x ./magiskboot ]; then
            echo "WARNING: magiskboot unavailable; module zip will abort at flash time with a clear message."
          fi
          ls -lh
          cd ..
          sed -i "s/^version=.*/version=v1.0-${STAMP}/" module.prop
          zip -r9 "../Ancient-LTS-R5Q-Magisk-${STAMP}.zip" * || true
          ls -lh ../*.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ancient-LTS-R5Q
          if-no-files-found: warn
          path: |
            arch/arm64/boot/Image.gz-dtb
            Ancient-LTS-R5Q-*.zip
            build.log
            build-clang.log
            actual-toolchain.txt
            diagnostics.txt
            clang-debug.log
            .config
